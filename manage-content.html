
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Course Content - EduCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <style>
        .module-card {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            background: #fff;
        }

        .lesson-row {
            border-top: 1px solid #dee2e6;
            padding: 15px 0;
        }

        .lesson-row:last-child {
            padding-bottom: 0;
        }

        .form-section {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            background: #fff;
        }

        .resource-note {
            font-size: 0.875rem;
        }

        .content-title {
            overflow-wrap: anywhere;
        }

        /* Keep this page aligned with the other content pages. */
        body.ec-consistent-page > nav.navbar {
            display: none;
        }
        
/* EduCore shared design styling */
:root {
  --primary: #24304a;
  --primary-dark: #19243b;
  --primary-light: #edf1f7;
  --page-bg: #f5f7fb;
  --text: #24304a;
  --muted: #6c757d;
  --border: #e1e5ee;
  --white: #ffffff;
  --success: #198754;
  --shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
}

body {
  background: #f5f7fb;
  color: #24304a;
}

/* Dark navy course header */
.course-hero {
  background: linear-gradient(120deg, #19243b, #334563);
  color: #ffffff;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.course-title {
  font-weight: 750;
}

.section-heading {
  color: #24304a;
  font-weight: 700;
}

.content-card {
  background: #ffffff;
  border-color: #e1e5ee;
  border-radius: 14px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
}

.card-heading {
  border-color: #e1e5ee;
}

.card-heading h2 {
  color: #24304a;
  font-weight: 700;
}

.lesson-title,
.placeholder-title {
  color: #24304a;
  font-weight: 700;
}

.lesson-description,
.curriculum-summary,
.module-count,
.lesson-row-type,
.player-placeholder,
.loading-message,
.empty-state {
  color: #6c757d;
}

.module-item {
  border-color: #e1e5ee;
}

.module-header {
  color: #24304a;
}

.module-header:hover {
  background: #f5f7fb;
}

.module-header.active,
.lesson-row:hover {
  background: #edf1f7;
}

.lesson-row.active {
  background: #edf1f7;
  border-color: #d6dce7;
}

.lesson-type-icon {
  background: #edf1f7;
  color: #24304a;
}

.player-area,
.player-area video,
.player-area iframe {
  background: #f5f7fb;
}

.placeholder-icon {
  background: #e1e5ee;
  color: #24304a;
}

.btn-outline-blue {
  border-color: #24304a;
  color: #24304a;
  border-radius: 9px;
}

.btn-outline-blue:hover {
  background: #edf1f7;
  color: #19243b;
}

.info-note {
  background: #edf1f7;
  color: #24304a;
}

#pageError {
  border-radius: 10px;
}

    </style>
</head>

<body class="bg-light ec-consistent-page">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a href="admin-dashboard.html" class="navbar-brand">
            EduCore Admin
        </a>

        <button id="logoutBtn" class="btn btn-light btn-sm">
            Logout
        </button>

    </div>
</nav>


<div class="container mt-4 mb-5">

    <!-- BACK BUTTON -->
    <a
        href="admin-dashboard.html"
        class="btn btn-outline-secondary btn-sm mb-3"
    >
        ← Back to Admin Dashboard
    </a>


    <!-- PAGE HEADING -->
    <div class="mb-4">

        <h2 class="ec-heading-bar">Manage Course Content</h2>

        <p class="text-muted">
            Add and organize modules, lessons, videos, PDFs and notes.
        </p>

    </div>


    <!-- COURSE INFORMATION -->
    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h5 id="courseName">Loading course...</h5>

            <p id="courseDescription" class="text-muted mb-0">
                Please wait...
            </p>

        </div>

    </div>

<!-- ADD LESSON -->
<div class="form-section shadow-sm mb-4">

    <h5 class="mb-3 ec-section-heading">Add Lesson</h5>

    <form id="lessonForm">

        <div class="mb-3">
            <label for="lessonTitle" class="form-label">
                Lesson Title
            </label>
            <input type="text" id="lessonTitle" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="lessonDescription" class="form-label">
                Lesson Description
            </label>
            <textarea id="lessonDescription" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label for="resourceType" class="form-label">
                Resource Type
            </label>
            <select id="resourceType" class="form-select" required>
                <option value="video">Video / Link</option>
                <option value="pdf">PDF</option>
            </select>
        </div>

        <!-- VIDEO / LINK URL -->
<div class="mb-3" id="resourceUrlGroup">
    <label for="resourceUrl" class="form-label">
        Resource URL
    </label>
    <input type="url" id="resourceUrl" class="form-control">
</div>

<!-- PDF GOOGLE DRIVE LINK -->
<div class="mb-3 d-none" id="pdfUploadGroup">
    <label for="pdfUrl" class="form-label">
        Google Drive PDF Link
    </label>
    <input
        type="url"
        id="pdfUrl"
        class="form-control"
        placeholder="Paste Google Drive PDF link"
    >
    <small class="text-muted">
        Upload your PDF to Google Drive and paste its shareable link here.
    </small>
</div>

        <button type="submit" id="addLessonBtn" class="btn btn-primary">
    Add Lesson
</button>

    </form>
</div>



    <!-- EXISTING CONTENT -->
    <div class="card shadow-sm">

        <div class="card-header">

            <h5 class="mb-0 ec-section-heading">Existing Lessons</h5>

        </div>

        <div class="card-body">

            <div id="moduleList">

                <p class="text-muted">
                    Loading course content...
                </p>

            </div>

        </div>

    </div>

</div>


<!-- BOOTSTRAP JAVASCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script type="module">

import { auth, db } from "./firebase.js";
import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
  collection,
doc,
getDoc,
getDocs,
addDoc,
deleteDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

// ======================================
// HTML ELEMENTS
// ======================================

const $ = (id) => document.getElementById(id);

const courseName = $("courseName");
const courseDescription = $("courseDescription");
const lessonForm = $("lessonForm");
const lessonModule = $("lessonModule");
const moduleList = $("moduleList");

// PDF / VIDEO FIELD TOGGLE
const resourceType = $("resourceType");
const resourceUrlGroup = $("resourceUrlGroup");
const pdfUploadGroup = $("pdfUploadGroup");
const resourceUrlInput = $("resourceUrl");
const pdfUrlInput = $("pdfUrl");

function toggleResourceFields() {
    const isPDF = resourceType.value === "pdf";

    resourceUrlGroup.classList.toggle("d-none", isPDF);
    pdfUploadGroup.classList.toggle("d-none", !isPDF);

    resourceUrlInput.required = !isPDF;
    pdfUrlInput.required = isPDF;
}

resourceType.addEventListener("change", toggleResourceFields);

toggleResourceFields();


// ======================================
// GET COURSE ID FROM URL
// ======================================

// The admin dashboard opens this page using:
// manage-content.html?courseId=COURSE_ID

const params = new URLSearchParams(window.location.search);

const courseId = params.get("courseId");


// Current signed-in admin
let currentUser = null;


// Prevent page actions until access is verified
let accessGranted = false;
// Send notifications to students enrolled in this course
async function sendContentNotifications(title, message, type) {
    const usersSnapshot = await getDocs(collection(db, "users"));

    for (const userDoc of usersSnapshot.docs) {
        if (String(userDoc.data().role || "").toLowerCase() !== "student") {
            continue;
        }

        const enrollmentsSnapshot = await getDocs(
            collection(db, "users", userDoc.id, "enrollments")
        );

        const isEnrolled = enrollmentsSnapshot.docs.some(
            enrollment => enrollment.data().courseId === courseId
        );

        if (!isEnrolled) continue;

        await addDoc(
            collection(db, "users", userDoc.id, "notifications"),
            {
                title,
                message,
                type,
                courseId,
                createdAt: new Date(),
                read: false
            }
        );
    }
}
// ======================================
// SEND NOTIFICATIONS TO ENROLLED STUDENTS
// ======================================

async function sendCourseNotification(title, message, type) {
    const usersSnapshot = await getDocs(collection(db, "users"));

    for (const userDoc of usersSnapshot.docs) {

        if (userDoc.data().role !== "student") continue;

        const enrollmentSnapshot = await getDocs(
            collection(db, "users", userDoc.id, "enrollments")
        );

        const enrolled = enrollmentSnapshot.docs.some(
            item => item.data().courseId === courseId
        );

        if (!enrolled) continue;

        await addDoc(
            collection(db, "users", userDoc.id, "notifications"),
            {
                title,
                message,
                type,
                courseId,
                createdAt: serverTimestamp(),
                read: false
            }
        );
      
    }
}


// ======================================
// AUTHENTICATION AND ADMIN ROLE CHECK
// ======================================

onAuthStateChanged(auth, async (user) => {

    accessGranted = false;

    if (!user) {

        window.location.href = "login.html";

        return;
    }

    currentUser = user;


    try {

        // Verify the user's role in Firestore
        const userSnap = await getDoc(
            doc(db, "users", user.uid)
        );


        if (
            !userSnap.exists() ||
            userSnap.data().role !== "admin"
        ) {

            alert("Access denied. Admin access is required.");

            window.location.href = "login.html";

            return;
        }


        // Check whether a course ID was provided
        if (!courseId) {

            courseName.textContent = "No course selected";

            courseDescription.textContent =
                "Return to the admin dashboard and click Manage Content beside a course.";

            moduleList.textContent = "";

            return;
        }


        // Verify that the course exists
        const courseSnap = await getDoc(
            doc(db, "courses", courseId)
        );


        if (!courseSnap.exists()) {

            courseName.textContent = "Course not found";

            courseDescription.textContent =
                "This course may have been deleted.";

            moduleList.textContent = "";

            return;
        }


        // Display course information
        const course = courseSnap.data();

        courseName.textContent =
            course.name || "Untitled course";

        courseDescription.textContent =
            course.description || "No description available.";


        accessGranted = true;


        // Load modules and lessons
        await loadModules();


    } catch (error) {

        console.error("Admin access error:", error);

        courseName.textContent = "Unable to load course";

        courseDescription.textContent =
            "Check the browser console and Firestore permissions.";

        moduleList.textContent =
            "Could not load course content.";

    }

});


// ======================================
// LOAD MODULES AND LESSONS
// ======================================


async function loadModules() {

    if (!accessGranted || !currentUser || !courseId) {
        return;
    }

    moduleList.innerHTML = "";

    try {

        const allLessons = [];

        // 1. Load new lessons directly from course
        const directLessonsRef = collection(
            db, "courses", courseId, "lessons"
        );

        const directLessonsSnap = await getDocs(directLessonsRef);

        directLessonsSnap.forEach((lessonDoc) => {
            allLessons.push({
                id: lessonDoc.id,
                moduleId: null,
                data: lessonDoc.data()
            });
        });

        // 2. Load old lessons from existing modules
        const modulesRef = collection(
            db, "courses", courseId, "modules"
        );

        const modulesSnap = await getDocs(modulesRef);

        for (const moduleDoc of modulesSnap.docs) {

            const lessonsRef = collection(
                db,
                "courses",
                courseId,
                "modules",
                moduleDoc.id,
                "lessons"
            );

            const lessonsSnap = await getDocs(lessonsRef);

            lessonsSnap.forEach((lessonDoc) => {
                allLessons.push({
                    id: lessonDoc.id,
                    moduleId: moduleDoc.id,
                    data: lessonDoc.data()
                });
            });
        }

        // 3. Sort oldest lesson first
        allLessons.sort((a, b) => {

            function getTime(lesson) {
                const value = lesson.data.createdAt;

                if (value?.toMillis) return value.toMillis();
                if (value instanceof Date) return value.getTime();

                return 0;
            }

            return getTime(a) - getTime(b);
        });

        if (allLessons.length === 0) {
            moduleList.innerHTML = `
                <p class="text-muted">No lessons added yet.</p>
            `;
            return;
        }

        // 4. Display lessons as one flat list
        allLessons.forEach((item, index) => {

            const lesson = item.data;

            const lessonRow = document.createElement("div");
            lessonRow.className = "lesson-row";

            const heading = document.createElement("h6");
            heading.className = "content-title mb-2";
            heading.textContent =
                `Lesson ${index + 1}: ${lesson.title || "Untitled lesson"}`;

            const badge = document.createElement("span");
            badge.className =
                "badge me-2 " + getBadgeClass(lesson.type);
            badge.textContent = getTypeLabel(lesson.type);

            const description = document.createElement("p");
            description.className = "text-muted mb-2";
            description.textContent =
                lesson.description || "No description provided.";

            lessonRow.append(heading, badge, description);

            if (lesson.resourceUrl) {

                const link = createSafeLink(lesson.resourceUrl.trim());

                if (link) {
                    link.className =
                        "btn btn-sm btn-outline-primary me-2 mt-2";
                    link.textContent = "Open Resource";
                    lessonRow.appendChild(link);
                }
            }

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className =
                "btn btn-sm btn-outline-danger mt-2";
            deleteButton.textContent = "Delete Lesson";

            deleteButton.addEventListener("click", async () => {
                await removeLesson(
                    item.moduleId,
                    item.id,
                    lesson.title || "Untitled lesson"
                );
            });

            lessonRow.appendChild(deleteButton);
            moduleList.appendChild(lessonRow);

        });

    } catch (error) {

        console.error("Load lessons error:", error);

        moduleList.innerHTML = `
            <p class="text-danger">
                Could not load lessons. Check Firestore permissions.
            </p>
        `;
    }
}


// ======================================
// RESOURCE TYPE HELPERS
// ======================================

function getTypeLabel(type) {

    switch ((type || "text").toLowerCase()) {

        case "video":
            return "Video";

        case "pdf":
            return "PDF";

        default:
            return "Text / Notes";
    }
}


function getBadgeClass(type) {

    switch ((type || "text").toLowerCase()) {

        case "video":
            return "bg-danger";

        case "pdf":
            return "bg-secondary";

        default:
            return "bg-primary";
    }
}


// ======================================
// CREATE SAFE RESOURCE LINK
// ======================================

function createSafeLink(url) {

    try {

        const parsedUrl = new URL(url);

        if (
            parsedUrl.protocol !== "https:" &&
            parsedUrl.protocol !== "http:"
        ) {
            return null;
        }


        const link = document.createElement("a");

        link.href = parsedUrl.href;

        link.target = "_blank";

        link.rel = "noopener noreferrer";

        return link;

    } catch {

        return null;
    }
}


// ======================================
// ADD LESSON
// ======================================


lessonForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!accessGranted || !currentUser || !courseId) {
        alert("You do not have permission to manage this course.");
        return;
    }

    const title = $("lessonTitle").value.trim();
    const description = $("lessonDescription").value.trim();
    const type = resourceType.value;

    if (!title || !description) {
        alert("Please enter the lesson title and description.");
        return;
    }

    let resourceUrl = "";

    if (type === "pdf") {
    resourceUrl = pdfUrlInput.value.trim();

    if (!resourceUrl) {
        alert("Please paste the Google Drive PDF link.");
        return;
    }

    try {
        const pdfLink = new URL(resourceUrl);

        if (
            !["drive.google.com", "docs.google.com"].includes(pdfLink.hostname)
        ) {
            alert("Please enter a valid Google Drive PDF link.");
            return;
        }
    } catch {
        alert("Please enter a valid Google Drive PDF link.");
        return;
    }

} else {
    resourceUrl = resourceUrlInput.value.trim();

    if (!createSafeLink(resourceUrl)) {
        alert("Please enter a valid HTTP or HTTPS resource URL.");
        return;
    }
}

    const addButton = $("addLessonBtn");
    addButton.disabled = true;

    try {
        // Save lesson details in Firestore
        await addDoc(
            collection(db, "courses", courseId, "lessons"),
            {
                title,
                description,
                type,
                resourceUrl,
                createdAt: new Date()
            }
        );

        const notificationTitle =
            type === "video" ? "New Video Added" : "New PDF Added";

        try {
            await sendCourseNotification(
                notificationTitle,
                `A new ${type} "${title}" has been added to ${courseName.textContent}.`,
                type
            );
        } catch (notificationError) {
            console.error("Notification error:", notificationError);
        }

        lessonForm.reset();
        toggleResourceFields();

        alert("Lesson added successfully.");

        await loadModules();

    } catch (error) {
        console.error("Add lesson error:", error);
        alert("Could not add lesson. Check Firestore permissions and the PDF link.");
    } finally {
        addButton.disabled = false;
    }
});

// ======================================
// DELETE LESSON
// ======================================

async function removeLesson(moduleId, lessonId, lessonTitle) {

    if (!accessGranted || !currentUser) return;

    const confirmed = confirm(
        `Delete the lesson "${lessonTitle}"? This action cannot be undone.`
    );

    if (!confirmed) return;

    try {

        let lessonRef;

        if (moduleId) {
            // Old lesson stored inside a module
            lessonRef = doc(
                db,
                "courses", courseId,
                "modules", moduleId,
                "lessons", lessonId
            );
        } else {
            // New lesson stored directly inside course
            lessonRef = doc(
                db,
                "courses", courseId,
                "lessons", lessonId
            );
        }

        await deleteDoc(lessonRef);

        alert("Lesson deleted successfully.");

        await loadModules();

    } catch (error) {

        console.error("Delete lesson error:", error);

        alert("Could not delete lesson. Check Firestore permissions.");
    }
}



// ======================================
// DELETE EMPTY MODULE
// ======================================

async function removeModule(moduleId, moduleName) {

    if (!accessGranted || !currentUser) {
        return;
    }


    // Firestore does not automatically delete subcollection documents.
    // Do not delete a module if it still has lessons.
    try {

        const lessonsRef = collection(
            db,
            "courses",
            courseId,
            "modules",
            moduleId,
            "lessons"
        );

        const lessonsSnap = await getDocs(lessonsRef);


        if (!lessonsSnap.empty) {

            alert(
                "This module still contains lessons. Delete its lessons first."
            );

            return;
        }


        const confirmed = confirm(
            `Delete the empty module "${moduleName}"?`
        );


        if (!confirmed) {
            return;
        }


        await deleteDoc(
            doc(
                db,
                "courses",
                courseId,
                "modules",
                moduleId
            )
        );


        alert("Module deleted successfully.");


        await loadModules();


    } catch (error) {

        console.error("Delete module error:", error);

        alert(
            "Could not delete module. Check Firestore permissions."
        );

    }

}


// ======================================
// LOGOUT
// ======================================

$("logoutBtn").addEventListener("click", async () => {

    try {

        await signOut(auth);

        window.location.href = "login.html";

    } catch (error) {

        console.error("Logout error:", error);

        alert("Could not log out. Please try again.");

    }

});

</script>

</body>
</html>
