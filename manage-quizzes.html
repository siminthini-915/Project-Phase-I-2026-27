<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Quizzes | EduCore</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f5f7fb;
      color: #24304a;
    }

    .container {
      max-width: 1000px;
    }

    .panel {
      background: #fff;
      border: 1px solid #e1e5ee;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .page-title {
      font-weight: 750;
    }

    .section-title {
      font-weight: 700;
      font-size: 19px;
    }

    .form-control,
    .form-select,
    .btn {
      border-radius: 9px;
    }

    .form-control,
    .form-select {
      padding: 10px 12px;
    }

    .muted {
      color: #6c757d;
      font-size: 13px;
    }

    .question-card,
    .quiz-card {
      border: 1px solid #e1e5ee;
      border-radius: 12px;
      padding: 18px;
      margin-top: 16px;
      background: #fff;
    }

    .question-card {
      background: #fbfcff;
    }

    #message:empty {
      display: none;
    }

    @media (max-width: 576px) {
      .panel {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="container py-4">
    <a href="admin-dashboard.html" class="btn btn-outline-secondary mb-3">
      &larr; Admin Dashboard
    </a>

    <h2 class="page-title">Manage Quizzes</h2>
    <p class="text-secondary">
      Create quizzes for a course by adding questions and options manually.
    </p>

    <div id="message" aria-live="polite"></div>


    <section class="panel">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h3 class="section-title mb-0">Created Quizzes</h3>
        <button
          type="button"
          id="refreshQuizzesBtn"
          class="btn btn-outline-secondary btn-sm"
        >
          Refresh
        </button>
      </div>

      <div id="createdQuizzes" class="mt-3">
        <p class="text-secondary">Loading quizzes...</p>
      </div>
    </section>
  </main>

<script type="module">
  import { auth, db } from "./firebase.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  import {
  collection,
  getDocs,
  getDoc,
  doc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

  const $ = id => document.getElementById(id);

  function showMessage(message) {
    const el = $("message");
    if (el) el.textContent = message;
  }

  async function verifyAdmin(user) {
    if (!user) return false;

    const snap = await getDoc(doc(db, "users", user.uid));

    return snap.exists() &&
      String(snap.data().role || "").toLowerCase() === "admin";
  }

  function downloadQuestionSheet(quiz) {
    const lines = [
      `EduCore - ${quiz.title || "Quiz"}`,
      `Course: ${quiz.courseName || "Not specified"}`,
      `Topic: ${quiz.topic || "Not specified"}`,
      "",
      "QUESTIONS AND OPTIONS",
      ""
    ];

    (quiz.questions || []).forEach((question, index) => {
      lines.push(`${index + 1}. ${question.text || "Question"}`);

      (question.options || []).forEach((option, i) => {
        lines.push(`   ${String.fromCharCode(65 + i)}. ${option}`);
      });

      lines.push(
        `   Correct Answer: ${question.options?.[question.correctIndex] || "Not specified"}`,
        ""
      );
    });

    const blob = new Blob([lines.join("\n")], {
      type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    const filename = (quiz.title || "quiz")
      .replace(/[^a-z0-9-_ ]/gi, "")
      .trim()
      .replace(/\s+/g, "_") || "quiz";

    link.href = url;
    link.download = `${filename}_questions.txt`;
    link.click();

    URL.revokeObjectURL(url);
  }

async function deleteQuiz(quizId, quizTitle) {
  const confirmDelete = confirm(
    `Are you sure you want to delete "${quizTitle || "this quiz"}"?`
  );

  if (!confirmDelete) return;

  try {
    await deleteDoc(doc(db, "quizzes", quizId));
    alert("Quiz deleted successfully.");
    await loadCreatedQuizzes();
  } catch (error) {
    console.error("Delete quiz error:", error);
    alert("Could not delete quiz. Please check Firestore permissions.");
  }
}

  async function loadCreatedQuizzes() {
    const container = $("createdQuizzes");
    container.textContent = "Loading quizzes...";

    try {
      const snapshot = await getDocs(collection(db, "quizzes"));

      const quizzes = snapshot.docs
        .map(item => ({ id: item.id, ...item.data() }))
        .sort((a, b) =>
          (b.createdAt?.toMillis?.() || 0) -
          (a.createdAt?.toMillis?.() || 0)
        );

      container.replaceChildren();

      if (!quizzes.length) {
        container.textContent = "No quizzes have been created yet.";
        return;
      }

      const row = document.createElement("div");
      row.className = "row g-3";

      quizzes.forEach(quiz => {
        const column = document.createElement("div");
        column.className = "col-12 col-md-6";

        const card = document.createElement("div");
        card.className = "quiz-card h-100";

        const heading = document.createElement("h5");
        heading.className = "fw-bold";
        heading.textContent = quiz.title || "Untitled Quiz";

        const course = document.createElement("p");
        course.textContent = `Course: ${quiz.courseName || "Not specified"}`;

        const topic = document.createElement("p");
        topic.textContent = `Topic: ${quiz.topic || "Not specified"}`;

        const count = document.createElement("p");
        count.textContent =
          `Questions: ${quiz.questionCount || quiz.questions?.length || 0}`;

        const marks = document.createElement("p");
        marks.textContent = `Total marks: ${quiz.totalMarks ?? "Not specified"}`;

        const status = document.createElement("span");
        status.className = quiz.published
          ? "badge text-bg-success"
          : "badge text-bg-secondary";
        status.textContent = quiz.published ? "Published" : "Draft";

        const downloadBtn = document.createElement("button");
        downloadBtn.type = "button";
        downloadBtn.className = "btn btn-outline-primary btn-sm mt-3 me-2";
        downloadBtn.textContent = "Download Questions";
        downloadBtn.addEventListener("click", () =>
          downloadQuestionSheet(quiz)
        );

        const editBtn = document.createElement("a");
editBtn.className = "btn btn-warning btn-sm mt-3 me-2";
editBtn.textContent = "Edit Quiz";
editBtn.href =
  `admin-quizzes.html?edit=${encodeURIComponent(quiz.id)}`;

const resultsBtn = document.createElement("a");
resultsBtn.className = "btn btn-primary btn-sm mt-3";
resultsBtn.textContent = "View Results";
resultsBtn.href =
  `admin-quiz-results.html?quizId=${encodeURIComponent(quiz.id)}`;

const deleteBtn = document.createElement("button");
deleteBtn.type = "button";
deleteBtn.className = "btn btn-danger btn-sm mt-3";
deleteBtn.textContent = "Delete Quiz";
deleteBtn.addEventListener("click", () => deleteQuiz(quiz.id, quiz.title));
  
        card.append(
  heading, course, topic, count, marks,
  status, document.createElement("br"),
  downloadBtn, editBtn, resultsBtn, deleteBtn
);
        column.appendChild(card);
        row.appendChild(column);
      });

      container.appendChild(row);

    } catch (error) {
      console.error(error);
      container.textContent = "Could not load quizzes. Check Firestore rules.";
    }
  }

  onAuthStateChanged(auth, async user => {
    if (!user) {
      location.href = "login.html";
      return;
    }

    try {
      if (!(await verifyAdmin(user))) {
        showMessage("Admin access only.");
        return;
      }

      await loadCreatedQuizzes();

    } catch (error) {
      console.error(error);
      showMessage("Could not open Manage Quizzes.");
    }
  });

  $("refreshQuizzesBtn")?.addEventListener("click", loadCreatedQuizzes);
</script>

</body>
</html>
