<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - EduCore</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- EduCore Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<!-- TOP BRAND BAR -->

<nav class="ec-topbar">

    <div class="container">

        <a href="index.html" class="ec-topbar-brand">
            EduCore
        </a>

        <div class="ec-topbar-buttons">

            <a
                href="index.html"
                class="btn btn-outline-light"
            >
                Home
            </a>

            <a
                href="signup.html"
                class="btn btn-light"
            >
                Sign Up
            </a>

        </div>

    </div>

</nav>


<!-- LOGIN SECTION -->

<section class="ec-auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="ec-auth-card">

                    <div class="text-center mb-4">

                        <span class="ec-label">
                            STUDENT & ADMIN PORTAL
                        </span>

                        <h2 class="mt-2">
                            Welcome Back
                        </h2>

                        <p>
                            Login to access your EduCore account.
                        </p>

                    </div>


                    <!-- ERROR MESSAGE -->

                    <div
                        id="errorMessage"
                        class="alert alert-danger d-none"
                    ></div>


                    <!-- LOGIN FORM -->

                    <form id="loginForm">


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100 mt-2"
                        >
                            Login
                        </button>


                    </form>


                    <!-- SIGNUP LINK -->

                    <div class="text-center mt-4">

                        <p class="mb-0">

                            Don't have an account?

                            <a href="signup.html">
                                Create Account
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- FOOTER -->

<footer class="ec-footer">

    <div class="container text-center">

        <strong>
            EduCore
        </strong>

        <p>
            Learning Management System
        </p>

    </div>

</footer>


<!-- LOGIN JAVASCRIPT -->

<script type="module">

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

import {
    auth,
    db
} from "./firebase.js";


const loginForm = document.getElementById("loginForm");
const errorMessage = document.getElementById("errorMessage");


loginForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    errorMessage.classList.add("d-none");

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    try {

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        /* EMAIL VERIFICATION */

        if (!user.emailVerified) {

            errorMessage.textContent =
                "Please verify your email before logging in.";

            errorMessage.classList.remove("d-none");

            return;
        }


        /* GET USER PROFILE */

        const userDoc =
            await getDoc(
                doc(db, "users", user.uid)
            );


        if (!userDoc.exists()) {

            errorMessage.textContent =
                "User profile not found.";

            errorMessage.classList.remove("d-none");

            return;
        }


        const userData =
            userDoc.data();


        /* ROLE BASED REDIRECT */

        if (userData.role === "supervisor") {
    window.location.href = "supervisor.html";

} else if (userData.role === "admin") {
    window.location.href = "admin-dashboard.html";

} else if (userData.role === "student") {
    window.location.href = "student-dashboard.html";

} else {
    await signOut(auth);
    errorMessage.textContent = "Invalid user role. Please contact the supervisor.";
    errorMessage.classList.remove("d-none");
}
    } catch (error) {

        console.error(error);

        errorMessage.textContent =
            "Invalid email or password.";

        errorMessage.classList.remove("d-none");

    }

});

</script>


</body>

</html>
